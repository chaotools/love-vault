name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check server JavaScript syntax
        run: find . -path ./node_modules -prune -o -path ./public/js -prune -o -name '*.js' -type f -print0 | xargs -0 -n1 node --check
      - name: Check browser module syntax
        run: |
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find public/js -type f -name '*.js' -print0)
      - name: Run tests
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev
