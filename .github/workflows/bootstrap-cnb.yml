name: Bootstrap Moonbox CNB image

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to CNB Docker registry
        uses: docker/login-action@v3
        with:
          registry: docker.cnb.cool
          username: cnb
          password: ${{ secrets.CNB_TOKEN }}
      - name: Build and push Moonbox image
        env:
          IMAGE: docker.cnb.cool/chaotools/moonbox
          TAG: ${{ github.sha }}
        run: |
          test -n "$IMAGE" && test -n "$TAG"
          docker buildx build --push \
            --tag "$IMAGE:$TAG" \
            --tag "$IMAGE:stable" \
            .