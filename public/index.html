<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e87b8e">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <title>爱人记忆库</title>
  <link rel="stylesheet" href="/style.css">
  <script>
    // 首屏前应用主题，避免深色模式闪烁
    try {
      var t = localStorage.getItem('vault-theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <!-- 小程序扫码登录；静态壳可公开，任何数据接口都需要会话。 -->
  <div class="login-overlay" id="loginOverlay" hidden>
    <div class="login-card">
      <div class="login-logo">💕</div>
      <h2>爱人记忆库</h2>
      <p class="login-sub">打开“超简单工具箱”小程序，在 Love Vault 中点击“扫码登录网页版”</p>
      <img id="loginQr" width="260" height="260" alt="Love Vault 登录二维码">
      <p class="login-err" id="loginErr" hidden>二维码已失效，请刷新页面重试。</p>
    </div>
  </div>

  <!-- 顶部工具条 -->
  <header class="toolbar">
    <div class="toolbar-brand">
      <div class="toolbar-logo">💕</div>
      <div class="toolbar-copy">
        <div class="toolbar-title" id="toolbarTitle">爱人记忆库</div>
        <div class="toolbar-subtitle">私密记忆空间</div>
      </div>
    </div>
    <div class="global-search">
      <input id="globalSearch" type="search" placeholder="搜索一切：过敏、杨枝甘露、李阿姨…" autocomplete="off">
      <div class="search-dropdown" id="searchDropdown" hidden></div>
    </div>
    <div class="toolbar-actions">
      <button class="icon-btn" id="quickNoteBtn" title="随手记" aria-label="随手记">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.5-4.5L16.8 4.2a2 2 0 0 1 2.8 2.8L8.3 18.3 4 20Z"/><path d="m14.8 6.2 3 3"/></svg>
      </button>
      <button class="icon-btn" id="musicBtn" title="背景音乐" aria-label="背景音乐" hidden>
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>
      </button>
      <button class="icon-btn" id="remindBtn" title="今日提醒" aria-label="今日提醒">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" title="切换深色 / 浅色" aria-label="切换深色或浅色">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="设置" aria-label="设置">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-2.5v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H6.4v-2.5h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.8-1.8.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2H15v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2V14h-.2a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
    </div>
  </header>

  <!-- 模块导航 -->
  <nav class="nav" id="nav">
    <span class="nav-heading">浏览</span>
    <a href="#/timeline" data-route="timeline">时间轴</a>
    <a href="#/calendar" data-route="calendar">日历</a>
    <a href="#/profile" data-route="profile">TA档案</a>
    <a href="#/preferences" data-route="preferences">偏好</a>
    <a href="#/people" data-route="people">人名</a>
    <a href="#/events" data-route="events">大事记</a>
    <a href="#/wishes" data-route="wishes">愿望&礼物</a>
    <a href="#/stats" data-route="stats">统计</a>
    <a href="#/ask" data-route="ask" id="navAsk" hidden>AI问答</a>
  </nav>

  <!-- 首屏（仅时间轴页显示） -->
  <section class="hero" id="hero" hidden>
    <div class="hearts" id="hearts"></div>
    <div class="hero-inner">
      <div class="hero-avatar">💑</div>
      <h1 class="hero-title" id="heroTitle">爱人记忆库</h1>
      <p class="hero-names" id="heroNames"></p>
      <div class="hero-lunar" id="heroLunar"></div>
      <div class="days-box" id="daysBox" hidden>
        <div class="days-num" id="daysNum">--</div>
        <div class="days-unit">在 一 起</div>
        <div class="days-time" id="daysTime"></div>
      </div>
      <div class="banners" id="banners"></div>
      <div class="memorial-chips" id="memorialChips"></div>
    </div>
  </section>

  <!-- 视图容器 -->
  <main id="view"></main>

  <!-- 灯箱 -->
  <div class="lightbox" id="lightbox" hidden>
    <div class="lb-media" id="lbMedia"></div>
    <button class="lb-nav lb-prev" id="lbPrev">‹</button>
    <button class="lb-nav lb-next" id="lbNext">›</button>
    <button class="lb-close" id="lbClose">×</button>
    <div class="lb-caption">
      <div class="lb-date" id="lbDate"></div>
      <div class="lb-note" id="lbNote"></div>
      <div class="lb-tags" id="lbTags"></div>
      <div class="lb-actions">
        <button class="ghost-btn lb-light" id="lbEdit">编辑</button>
        <button class="ghost-btn lb-light danger" id="lbDelete">删除</button>
      </div>
    </div>
    <div class="lb-counter" id="lbCounter"></div>
  </div>

  <audio id="bgm" loop></audio>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
