services:
  love-vault:
    # 本地开发使用 docker compose up --build；生产环境使用 deploy/docker-compose.yml。
    build: .
    container_name: love-vault
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000" # 仅由本机 Nginx / 小程序后端访问
    volumes:
      - ./data:/app/data     # 全部记忆都在这个目录，备份它就够了
    environment:
      - NODE_ENV=production
      - TRUST_PROXY=1
      # AI 配置也可以在这里用环境变量注入（优先级高于网页设置）
      # - AI_BASE_URL=https://open.bigmodel.cn/api/paas/v4
      # - AI_API_KEY=your-key
      # - AI_MODEL=glm-4-flash
